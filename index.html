<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عربون - حجز المواعيد</title>
  <script src="https://tailwindcss.com"></script>
  <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-100 p-4 text-slate-800">

<div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md">
  <h1 id="bizName" class="text-xl font-bold text-center text-slate-900">جاري التحميل...</h1>
  <p class="text-center text-slate-500 text-sm mb-5">احجز موعدك وأكده بإرسال وصل العربون</p>

  <form id="bookingForm" class="space-y-4">
    <div>
      <label class="block font-semibold text-sm mb-1">اختر الخدمة</label>
      <select id="serviceSelect" class="w-full p-3 border border-slate-300 rounded-xl" required></select>
    </div>

    <div>
      <label class="block font-semibold text-sm mb-1">تاريخ الموعد</label>
      <input type="date" id="bookingDate" class="w-full p-3 border border-slate-300 rounded-xl" required>
    </div>

    <div>
      <label class="block font-semibold text-sm mb-1">الساعة المناسبة</label>
      <select id="bookingTime" class="w-full p-3 border border-slate-300 rounded-xl" required>
        <option value="10:00">10:00 صباحاً</option>
        <option value="11:30">11:30 صباحاً</option>
        <option value="14:00">14:00 زوالاً</option>
        <option value="16:00">16:00 مساءً</option>
        <option value="18:00">18:00 مساءً</option>
      </select>
    </div>

    <div id="bankBox" style="display:none;" class="bg-green-50 border border-dashed border-green-600 p-4 rounded-xl">
      <div class="text-sm text-green-800">
        المطلوب دفع عربون: <strong id="depositText">0 درهم</strong>
      </div>
      <div class="text-xs text-slate-600 mt-1">
        البنك: <span id="bankName"></span>
      </div>
      <div class="flex justify-between items-center bg-white p-2 rounded-lg mt-2 border border-green-200 font-mono text-xs">
        <span id="ribText"></span>
        <button type="button" onclick="copyRib()" class="bg-green-600 text-white px-3 py-1 rounded-md">نسخ RIB</button>
      </div>
    </div>

    <div>
      <label class="block font-semibold text-sm mb-1">الاسم الكامل</label>
      <input type="text" id="clientName" placeholder="مثال: سلمى العلمي" class="w-full p-3 border border-slate-300 rounded-xl" required>
    </div>

    <div>
      <label class="block font-semibold text-sm mb-1">رقم الواتساب</label>
      <input type="tel" id="clientPhone" placeholder="06XXXXXXXX" class="w-full p-3 border border-slate-300 rounded-xl" required>
    </div>

    <div>
      <label class="block font-semibold text-sm mb-1">صورة وصل التحويل (العربون)</label>
      <input type="file" id="receiptFile" accept="image/*" class="w-full p-2 border border-slate-300 rounded-xl" required>
    </div>

    <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-base">
      تأكيد الحجز وإرسال الوصل
    </button>
    <div id="statusMsg" class="text-center font-semibold text-sm mt-2"></div>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
