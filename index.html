<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عربون - حجز المواعيد</title>
  <link rel="stylesheet" href="https://jsdelivr.net">
</head>
<body>

<main class="container" style="max-width: 480px; margin-top: 20px;">
  <article>
    <header style="text-align: center;">
      <h2 id="bizName" style="margin-bottom: 5px;">جاري التحميل...</h2>
      <small>احجز موعدك وأكده بإرسال وصل العربون</small>
    </header>

    <form id="bookingForm">
      <label>اختر الخدمة
        <select id="serviceSelect" required></select>
      </label>

      <label>تاريخ الموعد
        <input type="date" id="bookingDate" required>
      </label>

      <label>الساعة المناسبة
        <select id="bookingTime" required>
          <option value="10:00">10:00 صباحاً</option>
          <option value="11:30">11:30 صباحاً</option>
          <option value="14:00">14:00 زوالاً</option>
          <option value="16:00">16:00 مساءً</option>
          <option value="18:00">18:00 مساءً</option>
        </select>
      </label>

      <div id="bankBox" style="display:none; background:#f0fdf4; border:1px dashed #16a34a; padding:12px; border-radius:10px; margin-bottom:16px; color:#14532d;">
        <div>المطلوب دفع عربون: <strong id="depositText">0 درهم</strong></div>
        <small>البنك: <span id="bankName"></span></small>
        <div style="display:flex; justify-content:space-between; align-items:center; background:#fff; padding:8px; border-radius:6px; margin-top:8px;">
          <code id="ribText" style="color:#000;"></code>
          <button type="button" onclick="copyRib()" style="width:auto; padding:4px 10px; margin:0; font-size:13px;">نسخ RIB</button>
        </div>
      </div>

      <label>الاسم الكامل
        <input type="text" id="clientName" placeholder="مثال: سلمى العلمي" required>
      </label>

      <label>رقم الواتساب
        <input type="tel" id="clientPhone" placeholder="06XXXXXXXX" required>
      </label>

      <label>صورة وصل التحويل (العربون)
        <input type="file" id="receiptFile" accept="image/*" required>
      </label>

      <button type="submit" id="submitBtn">تأكيد الحجز وإرسال الوصل</button>
      <p id="statusMsg" style="text-align:center; font-weight:bold;"></p>
    </form>
  </article>
</main>

<script src="https://jsdelivr.net"></script>
<script src="app.js"></script>
</body>
</html>
